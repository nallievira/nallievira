<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#8A651E"/>
      <stop offset="45%" stop-color="#D6AF4B"/>
      <stop offset="75%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#B8892E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="78" text-anchor="middle" fill="#D6DAE0" font-size="26" font-weight="500" letter-spacing="3">
      HI, I'M
    </text>

    <text x="600" y="165" text-anchor="middle" fill="url(#gold)" font-size="72" font-weight="800" letter-spacing="5" filter="url(#glow)">
      ELLEN ELVIRA
    </text>

    <line x1="245" y1="198" x2="955" y2="198" stroke="url(#gold)" stroke-width="2" opacity="0.65"/>

    <text x="600" y="238" text-anchor="middle" fill="#AEB6C2" font-size="20" font-weight="500" letter-spacing="2">
      COMPUTER SCIENCE • BACKEND ENGINEERING • MACHINE LEARNING
    </text>

    <text x="600" y="272" text-anchor="middle" fill="#82745A" font-size="15" letter-spacing="1.5">
      BUILDING SYSTEMS • UNDERSTANDING HOW THE PIECES FIT TOGETHER
    </text>
  </g>
</svg>